{{- /* Map chezmoi's os/arch names to zoxide's release naming */ -}}
{{- $zoxideArch := dict "amd64" "x86_64" "arm64" "aarch64" -}}
{{- $zoxideOS := dict "linux" "unknown-linux-musl" "darwin" "apple-darwin" -}}

{{- $nvimOS := "linux" -}} {{- if eq .chezmoi.os "darwin" }}{{ $nvimOS = "macos" }}{{ end -}}
{{- $nvimArch := "x86_64" -}}
{{- if eq .chezmoi.arch "arm64" }}{{ $nvimArch = "arm64" }}{{ end -}}

{{- if .nvim.enabled }}
{{-   $url := .nvim.customUrl }}
{{-   if eq .nvim.source "forgejo" }}
{{-     $url = "ssh://git@forge.aidan-w.dev/aidan/nvim.git" }}
{{-   else if eq .nvim.source "github" }}
{{-     $url = "https://github.com/aidan-dubs/nvim.git" }}
{{-   end }}

[".local"]
    type = "archive"
    url = {{ gitHubLatestReleaseAssetURL "neovim/neovim" (printf "nvim-%s-%s.tar.gz" $nvimOS $nvimArch ) | quote }}
    stripComponents = 1
    include = ["*/bin/**", "*/lib/**", "*/share/nvim/**"]

[".config/nvim"]
type = "git-repo"
url = {{ $url | quote }}
refreshPeriod = "168h"
{{- end }}

{{- if .sshPrivate.enabled }}
{{-   $url := .sshPrivate.customUrl }}
{{-   if eq .sshPrivate.source "forgejo" }}
{{-     $url = "ssh://git@forge.aidan-w.dev/aidan/ssh-private-config.git" }}
{{-   end }}
[".ssh/private"]
type = "git-repo"
url = {{ $url | quote }}
refreshPeriod = "168h"
{{- end }}

[".local/share/oh-my-zsh"]
type = "archive"
url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
stripComponents = 1
refreshPeriod = "168h"

[".config/oh-my-zsh/plugins/zsh-autosuggestions"]
type = "archive"
url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
stripComponents = 1
refreshPeriod = "168h"

[".config/oh-my-zsh/plugins/fzf-tab"]
type = "archive"
url = "https://github.com/Aloxaf/fzf-tab/archive/master.tar.gz"
stripComponents = 1
refreshPeriod = "168h"

[".config/oh-my-zsh/plugins/zsh-syntax-highlighting"]
type = "archive"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
stripComponents = 1
refreshPeriod = "168h"

[".local/bin/fzf"]
type = "archive-file"
url = {{ gitHubLatestReleaseAssetURL "junegunn/fzf" (printf "fzf-*-%s_%s.tar.gz" .chezmoi.os .chezmoi.arch) | quote }}
path = "fzf"
executable = true



[".local/bin/zoxide"]
type = "archive-file"
url = {{ gitHubLatestReleaseAssetURL "ajeetdsouza/zoxide" (printf "zoxide-*-%s-%s.tar.gz" (index $zoxideArch .chezmoi.arch) (index $zoxideOS .chezmoi.os)) | quote }}
path = "zoxide"
executable = true
